<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S3 · Upload e URL pré-assinada</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1419;
        --surface: #1a2332;
        --border: #2d3a4d;
        --text: #e8eef5;
        --muted: #8b9cad;
        --accent: #4da3ff;
        --danger: #ff6b6b;
        --ok: #6bcf7f;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4f6f9;
          --surface: #ffffff;
          --border: #d8dee8;
          --text: #1a2332;
          --muted: #5c6b7e;
          --accent: #0d6efd;
          --danger: #d63333;
          --ok: #198754;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        padding: 2rem 1rem;
      }
      main {
        max-width: 36rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 650;
        margin: 0 0 0.25rem;
      }
      .subtitle {
        color: var(--muted);
        font-size: 0.9rem;
        margin: 0 0 1.75rem;
      }
      section {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.25rem;
        margin-bottom: 1rem;
      }
      section h2 {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 0.75rem;
        font-weight: 600;
      }
      label {
        display: block;
        font-size: 0.875rem;
        margin-bottom: 0.35rem;
      }
      input[type='text'],
      input[type='file'] {
        width: 100%;
        padding: 0.55rem 0.65rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-size: 0.9rem;
      }
      input[type='file'] {
        padding: 0.45rem;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin-top: 0.75rem;
      }
      button {
        cursor: pointer;
        border: none;
        border-radius: 8px;
        padding: 0.55rem 1rem;
        font-size: 0.9rem;
        font-weight: 600;
        background: var(--accent);
        color: #fff;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      button.secondary {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--accent);
      }
      .msg {
        margin-top: 0.75rem;
        font-size: 0.875rem;
        padding: 0.5rem 0.65rem;
        border-radius: 8px;
        word-break: break-word;
      }
      .msg.error {
        background: color-mix(in srgb, var(--danger) 18%, transparent);
        color: var(--danger);
      }
      .msg.success {
        background: color-mix(in srgb, var(--ok) 18%, transparent);
        color: var(--ok);
      }
      .msg.info {
        background: color-mix(in srgb, var(--accent) 14%, transparent);
        color: var(--text);
      }
      .link-box {
        margin-top: 0.75rem;
      }
      .link-box a {
        color: var(--accent);
      }
      .stack {
        display: grid;
        gap: 0.75rem;
      }
      .inline-fields {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr));
        gap: 0.75rem;
      }
      .card-list {
        display: grid;
        gap: 0.75rem;
        margin-top: 1rem;
      }
      .file-card {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.9rem;
        background: color-mix(in srgb, var(--surface) 88%, var(--bg));
      }
      .file-card strong {
        display: block;
        margin-bottom: 0.2rem;
      }
      .meta {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .empty {
        color: var(--muted);
        font-size: 0.9rem;
        margin-top: 0.5rem;
      }
      .hint {
        font-size: 0.875rem;
        color: var(--muted);
        margin: 0 0 0.75rem;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Upload S3</h1>
      <p class="subtitle">
        Envie arquivos para o S3, registre no banco e gerencie tudo por aqui com listagem, filtro, paginação e exclusão.
      </p>

      <section aria-labelledby="upload-heading">
        <h2 id="upload-heading">1 · Enviar arquivo</h2>
        <label for="file">Arquivo</label>
        <input id="file" type="file" />
        <div class="row">
          <button type="button" id="btn-upload">Enviar</button>
        </div>
        <div id="upload-msg" class="msg" hidden></div>
      </section>

      <section aria-labelledby="url-heading">
        <h2 id="url-heading">2 · Gerar URL pré-assinada</h2>
        <label for="key">Key no bucket</label>
        <input id="key" type="text" placeholder="uploads/uuid.ext" autocomplete="off" />
        <div class="row">
          <button type="button" id="btn-url" class="secondary" disabled>
            Gerar link para abrir
          </button>
        </div>
        <div id="url-msg" class="msg" hidden></div>
        <div id="url-link" class="link-box" hidden></div>
      </section>

      <section aria-labelledby="list-heading">
        <h2 id="list-heading">3 · Listar arquivos</h2>
        <div class="stack">
          <div class="inline-fields">
            <div>
              <label for="filter-type">Tipo</label>
              <input id="filter-type" type="text" placeholder="image ou application/pdf" autocomplete="off" />
            </div>
            <div>
              <label for="page">Página</label>
              <input id="page" type="text" value="1" inputmode="numeric" />
            </div>
            <div>
              <label for="limit">Limite</label>
              <input id="limit" type="text" value="10" inputmode="numeric" />
            </div>
          </div>
          <div class="row">
            <button type="button" id="btn-list" class="secondary">Atualizar lista</button>
          </div>
        </div>
        <div id="list-msg" class="msg" hidden></div>
        <div id="list-meta" class="hint" hidden></div>
        <div id="files" class="card-list"></div>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      let uploadedKey = '';
      let uploadedId = '';

      function showMsg(el, text, kind) {
        el.hidden = false;
        el.textContent = text;
        el.className = 'msg ' + (kind || 'info');
      }

      function hideMsg(el) {
        el.hidden = true;
        el.textContent = '';
      }

      function getErrorDetail(data, fallback) {
        if (typeof data?.message === 'string') {
          return data.message;
        }

        if (Array.isArray(data?.message)) {
          return data.message.join(' ');
        }

        return fallback;
      }

      function setKeyValue(key) {
        uploadedKey = key || '';
        $('key').value = uploadedKey;
        $('btn-url').disabled = !uploadedKey;
      }

      function formatBytes(bytes) {
        if (typeof bytes !== 'number' || Number.isNaN(bytes)) {
          return '-';
        }
        if (bytes < 1024) {
          return bytes + ' B';
        }
        if (bytes < 1024 * 1024) {
          return (bytes / 1024).toFixed(1) + ' KB';
        }
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      }

      function renderLink(url) {
        const linkBox = $('url-link');
        linkBox.hidden = false;
        linkBox.innerHTML = '';

        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = 'Abrir arquivo no S3';
        linkBox.appendChild(a);
      }

      async function generateUrlFromKey(key) {
        const msg = $('url-msg');
        hideMsg(msg);
        $('url-link').hidden = true;
        $('url-link').innerHTML = '';

        if (!key) {
          showMsg(msg, 'Informa uma key válida primeiro.', 'error');
          return;
        }

        const btn = $('btn-url');
        btn.disabled = true;

        try {
          const res = await fetch('/upload/url?key=' + encodeURIComponent(key));
          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            showMsg(msg, 'Erro ao gerar URL: ' + getErrorDetail(data, res.statusText), 'error');
            return;
          }

          const seconds = data.expiresInSeconds ?? 120;
          showMsg(msg, 'Link válido por ~' + seconds + ' s. Usa o botão abaixo.', 'success');
          renderLink(data.url);
        } catch (e) {
          showMsg(msg, 'Falha na rede ou no servidor.', 'error');
        } finally {
          btn.disabled = !$('key').value.trim();
        }
      }

      function createFileCard(file) {
        const card = document.createElement('div');
        card.className = 'file-card';

        const title = document.createElement('strong');
        title.textContent = file.originalName || '(sem nome)';
        card.appendChild(title);

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent =
          'Tipo: ' +
          (file.tipoSimples ?? file.mimeType) +
          ' · Tamanho: ' +
          formatBytes(file.sizeBytes);

        const created = document.createElement('div');
        created.className = 'meta';
        created.textContent = 'Criado em: ' + new Date(file.createdAt).toLocaleString('pt-BR');
        card.appendChild(meta);
        card.appendChild(created);

        const row = document.createElement('div');
        row.className = 'row';

        const openBtn = document.createElement('button');
        openBtn.type = 'button';
        openBtn.className = 'secondary';
        openBtn.textContent = 'Gerar link';
        openBtn.addEventListener('click', async () => {
          setKeyValue(file.key);
          await generateUrlFromKey(file.key);
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.textContent = 'Excluir';
        deleteBtn.addEventListener('click', async () => {
          const confirmed = window.confirm('Excluir o arquivo "' + file.originalName + '"?');
          if (!confirmed) {
            return;
          }

          deleteBtn.disabled = true;
          try {
            const res = await fetch('/upload?key=' + encodeURIComponent(file.key), {
              method: 'DELETE',
            });
            const data = await res.json().catch(() => ({}));

            if (!res.ok) {
              showMsg($('list-msg'), 'Erro ao excluir: ' + getErrorDetail(data, res.statusText), 'error');
              return;
            }

            if (uploadedKey === file.key) {
              setKeyValue('');
              uploadedId = '';
              hideMsg($('url-msg'));
              $('url-link').hidden = true;
              $('url-link').innerHTML = '';
            }

            showMsg($('list-msg'), 'Arquivo excluído com sucesso.', 'success');
            await refreshList();
          } catch (e) {
            showMsg($('list-msg'), 'Falha na rede ou no servidor.', 'error');
          } finally {
            deleteBtn.disabled = false;
          }
        });

        row.appendChild(openBtn);
        row.appendChild(deleteBtn);
        card.appendChild(row);

        return card;
      }

      async function refreshList() {
        const type = $('filter-type').value.trim();
        const page = $('page').value.trim() || '1';
        const limit = $('limit').value.trim() || '10';
        const listMsg = $('list-msg');
        const listMeta = $('list-meta');
        const filesEl = $('files');
        const btn = $('btn-list');

        hideMsg(listMsg);
        listMeta.hidden = true;
        listMeta.textContent = '';
        filesEl.innerHTML = '';
        btn.disabled = true;

        const params = new URLSearchParams();
        if (type) params.set('type', type);
        params.set('page', page);
        params.set('limit', limit);

        try {
          const res = await fetch('/upload/files?' + params.toString());
          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            showMsg(listMsg, 'Erro ao listar: ' + getErrorDetail(data, res.statusText), 'error');
            return;
          }

          const items = Array.isArray(data.items) ? data.items : [];
          listMeta.hidden = false;
          listMeta.textContent =
            'Página ' +
            data.page +
            ' de ' +
            data.totalPages +
            ' | total: ' +
            data.total +
            ' arquivo(s)';

          if (!items.length) {
            filesEl.innerHTML = '<p class="empty">Nenhum arquivo encontrado para este filtro.</p>';
            return;
          }

          items.forEach((file) => {
            filesEl.appendChild(createFileCard(file));
          });
        } catch (e) {
          showMsg(listMsg, 'Falha na rede ou no servidor.', 'error');
        } finally {
          btn.disabled = false;
        }
      }

      $('btn-upload').addEventListener('click', async () => {
        const input = $('file');
        const msg = $('upload-msg');
        hideMsg(msg);

        if (!input.files?.length) {
          showMsg(msg, 'Escolha um arquivo antes de enviar.', 'error');
          return;
        }

        const fd = new FormData();
        fd.append('file', input.files[0]);

        const btn = $('btn-upload');
        btn.disabled = true;
        $('btn-url').disabled = true;

        try {
          const res = await fetch('/upload', { method: 'POST', body: fd });
          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            showMsg(msg, 'Erro no upload: ' + getErrorDetail(data, res.statusText), 'error');
            $('btn-url').disabled = !uploadedKey;
            return;
          }

          setKeyValue(typeof data.key === 'string' ? data.key : '');
          uploadedId = typeof data.id === 'string' ? data.id : '';
          hideMsg($('url-msg'));
          $('url-link').hidden = true;
          $('url-link').innerHTML = '';

          if (!uploadedKey) {
            showMsg(msg, 'Resposta estranha do servidor (sem key).', 'error');
            $('btn-url').disabled = true;
            return;
          }

          showMsg(
            msg,
            'Arquivo enviado com sucesso. ID: ' + uploadedId + ' | key pronta para visualizar.',
            'success',
          );
          await refreshList();
        } catch (e) {
          showMsg(msg, 'Falha na rede ou no servidor.', 'error');
          $('btn-url').disabled = !uploadedKey;
        } finally {
          btn.disabled = false;
        }
      });

      $('btn-url').addEventListener('click', async () => {
        await generateUrlFromKey($('key').value.trim() || uploadedKey);
      });

      $('btn-list').addEventListener('click', refreshList);
      $('key').addEventListener('input', (event) => {
        const value = event.target.value.trim();
        $('btn-url').disabled = !value;
      });

      refreshList();
    </script>
  </body>
</html>
